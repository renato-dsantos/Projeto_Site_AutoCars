<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anticars - Administrador</title>
    
    <link rel="stylesheet" href="../css/usuario.css">
    
</head>
<body>
     <header>
        <a href="../index.html"><h1>AntiCars</h1></a>
            <nav>  
                    <a class="idUsuario" href="usuario.html">usuario</a>
                    <a href="login.html">Login</a>
                    <a href="../pages/cadastro.html">Cadastro</a>
                    <a href="../pages/veiculos.html">Veículos</a>
            </nav>
        </header>
    <main>
        <div class="tab">
        <button class="tablinks" onclick="openTabs(event, 'dados')">Alterar Dados</button>
        <button class="tablinks" onclick="openTabs(event, 'pedidos')">Verificar pedidos</button>
        </div>

                    <div id="dados" class="tabcontent">
                    <h3>Alterar Dados</h3>
                     <form id="formEditarUsuario">


                            <label>Nome:</label>
                            <input type="text" id="nome">

                            <label>Email:</label>
                            <input type="email" id="email">

                            <label>Data de Nascimento:</label>
                            <input type="date" id="datanascimento">

                            <label>Telefone:</label>
                            <input type="text" id="telefone">

                            <label>CPF:</label>
                            <input type="text" id="cpf">

                            <label style="display: none;">CNPJ:</label>
                            <input style="display: none;" type="text" id="cnpj">

                            <label>CEP:</label>
                            <input type="text" id="cep">

                            <label>Rua:</label>
                            <input type="text" id="rua">

                            <label>Número:</label>
                            <input type="text" id="numero">

                            <label>Complemento:</label>
                            <input type="text" id="complemento">

                            <label>Bairro:</label>
                            <input type="text" id="bairro">

                            <label>Cidade:</label>
                            <input type="text" id="cidade">

                            <label>Estado:</label>
                            <input type="text" id="estado">

                            <input type="hidden" id="id">

                            <button id="btnSalvar" type="submit">Salvar</button>

                        </form>

                    
                    </div>

                    <div id="pedidos" class="tabcontent">
                    <h3>Verificar pedidos</h3>
                    
                             <table id="tabelaCarros">  
                                    
                                    <thead>
                                        <th>Código do carro</th>
                                        <th>Marca</th>
                                        <th>Modelo</th>
                                        <th>ano</th>
                                        <th>KM</th>
                                        <th>Gerenciar</th>  
                                    </thead> 
                                    <tbody>   
                                        <td>01</td>
                                        <td>Volkswagen</td>  
                                        <td>Fusca</td>  
                                        <td>1972</td>
                                        <td>82.000 </td> 
                                     <button class="btnExcluirCar" >Excluir</button>             
                                    </tbody>
                            </table> 
                    </div>


    </main>

<script src="../js/usuario.js"></script>    
</body>
</html>
